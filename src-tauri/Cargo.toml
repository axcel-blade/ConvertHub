[package]
name = "converthub"
version = "0.1.0"
description = "ConvertHub - local multimedia conversion toolkit"
edition = "2021"
license = "MIT"

[lib]
name = "converthub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
docx-rs = "0.4.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico", "tga", "pnm", "qoi"] }
infer = "0.22.0"
kamadak-exif = "0.6.1"
lopdf = "0.45.0"
pdf-extract = "0.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rust_xlsxwriter = "0.99.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust2 = "0.23.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
uuid = { version = "1.27.0", features = ["v4"] }
which = "8.0.6"
zip = { version = "9.0.0", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
